# Test configuration: a random per-run JWT secret and an unreachable signal-service (fallback path).
pv.jwt.secret=${random.uuid}${random.uuid}
pv.signal-service.url=http://127.0.0.1:9
pv.signal-service.timeout=PT0.5S
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=classpath:db/migration/{vendor}
