# pharmacy-service configuration. Secrets come only from environment variables (see .env.example).
spring.application.name=pharmacy-service
server.port=8081

spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:pharmavigil}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=classpath:db/migration/{vendor}

pv.jwt.secret=${JWT_SECRET:}
pv.signal-service.url=${SIGNAL_SERVICE_URL:http://localhost:8084}

# Side-effect reports are stored first and forwarded to intake-gateway by a background relay; while intake is
# down they wait as PENDING_SUBMISSION and are retried.
pv.intake.url=${INTAKE_GATEWAY_URL:http://localhost:8082}
pv.intake.forward-enabled=true
pv.intake.forward-interval=PT5S
pv.intake.timeout=PT3S

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
