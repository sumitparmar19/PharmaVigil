# Test configuration: random per-run JWT secret; the broker addresses come from Testcontainers.
pv.jwt.secret=${random.uuid}${random.uuid}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=classpath:db/submission/{vendor}
spring.kafka.consumer.auto-offset-reset=earliest
pv.outbox.poll-interval=PT0.2S
pv.kafka.retry-interval-ms=100
logging.level.org.apache.kafka=WARN
