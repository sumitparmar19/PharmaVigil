# submission-gateway configuration. Secrets come only from environment variables (see .env.example).
spring.application.name=submission-gateway
server.port=8085

spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:pharmavigil}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=classpath:db/submission/{vendor}

pv.jwt.secret=${JWT_SECRET:}

# Kafka: consumes case.ready, publishes submission.status through the outbox relay.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.auto-offset-reset=earliest
logging.level.org.apache.kafka=WARN

# JMS (ActiveMQ Artemis): transacted sessions for sending and listening; the broker redelivers a failed message
# and moves it to its dead-letter address (DLQ) after its max delivery attempts.
spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:}
spring.artemis.password=${ARTEMIS_PASSWORD:}
spring.jms.template.session.transacted=true
spring.jms.listener.session.transacted=true

# The mock regulator (validates against the official E2B(R3) schemas and answers ACK/NACK). Off for a real
# gateway; without the schema set it NACKs everything ("cannot validate").
pv.regulator.mock.enabled=true
pv.e2b.xsd-dir=${PV_E2B_XSD_DIR:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
