# intake-gateway configuration. Secrets come only from environment variables (see .env.example).
spring.application.name=intake-gateway
server.port=8082

spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:pharmavigil}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=classpath:db/migration/{vendor}

pv.jwt.secret=${JWT_SECRET:}

# SOAP partner intake (ADR-009): WS-Security UsernameToken + Timestamp. No default credentials: without
# SOAP_PARTNER_USER and SOAP_PARTNER_PASSWORD every SOAP call is refused.
spring.webservices.path=/ws
pv.soap.partner-user=${SOAP_PARTNER_USER:}
pv.soap.partner-password=${SOAP_PARTNER_PASSWORD:}

# Official ICH E2B(R3) schema set (scripts/fetch-e2b-xsd.sh). Without it, intake still accepts well-formed
# messages and records that they were not schema-checked.
pv.e2b.xsd-dir=${PV_E2B_XSD_DIR:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
