# Test configuration: a random per-run JWT secret and fixed, test-only SOAP partner credentials (a random
# value would differ on every lookup, so the server and the test client would never agree).
pv.jwt.secret=${random.uuid}${random.uuid}
pv.soap.partner-user=partner-test
pv.soap.partner-password=test-only-partner-password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=classpath:db/migration/{vendor}
spring.webservices.path=/ws
