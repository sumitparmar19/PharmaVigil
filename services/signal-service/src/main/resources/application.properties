# signal-service configuration. Secrets come only from environment variables (see .env.example).
spring.application.name=signal-service
server.port=8084

spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:pharmavigil}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.flyway.locations=classpath:db/migration/{vendor}

pv.jwt.secret=${JWT_SECRET:}

# Folder written by `pv-ml export-signals` (signals.csv, signal_trend.csv, signals_meta.json). Loaded at start-up
# when its content is new; empty = no signal data (warnings come back empty, never invented).
pv.signals.dir=${PV_SIGNALS_DIR:}
# Warning rule shown at the counter: EB05 (lower 5% bound of the EBGM) at or above this value.
pv.signals.warning-eb05=2.0
pv.signals.warning-limit=10

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
