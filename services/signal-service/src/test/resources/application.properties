# Test configuration: random per-run JWT secret; the synthetic signal export fixture (invented reports, not FAERS).
pv.jwt.secret=${random.uuid}${random.uuid}
spring.flyway.locations=classpath:db/migration/{vendor}
pv.signals.dir=src/test/resources/signal-export
# The tiny fixture's strongest pairs have EB05 just under 2; a lower threshold lets the tests see warnings.
pv.signals.warning-eb05=1.5
