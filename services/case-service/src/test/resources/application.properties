pv.jwt.secret=${random.uuid}${random.uuid}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=classpath:db/case/{vendor}
# Kafka stays off unless a test starts a broker (KafkaPipelineTest); no model bundle unless a test sets one.
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
pv.outbox.enabled=false
pv.models.dir=
logging.level.org.apache.kafka=WARN
