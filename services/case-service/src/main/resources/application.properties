# case-service configuration. Secrets come only from environment variables (see .env.example).
spring.application.name=case-service
server.port=8083

spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:pharmavigil}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=classpath:db/migration/{vendor}

pv.jwt.secret=${JWT_SECRET:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# E2B(R3) export: sender/receiver identifiers and the official schema set (scripts/fetch-e2b-xsd.sh). Without
# the schemas an export is never marked valid, so nothing can be queued for submission (engineering rule 7).
pv.e2b.sender-id=PHARMAVIGIL
pv.e2b.receiver-id=MOCK-REGULATOR
pv.e2b.xsd-dir=${PV_E2B_XSD_DIR:}

# Kafka: report.received leaves through the outbox relay (pv.outbox.*); idempotent producer, all replicas ack.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
logging.level.org.apache.kafka=WARN
spring.kafka.consumer.auto-offset-reset=earliest

# Model bundle (pv-ml java-bundle or a trained bundle). Empty: manual coding, seriousness unknown.
pv.models.dir=${PV_MODEL_DIR:}
pv.triage.serious-threshold=0.5

# Narrative drafts: Claude when both are set (the model id only ever comes from CLAUDE_MODEL), template otherwise.
pv.narrative.api-key=${ANTHROPIC_API_KEY:}
pv.narrative.model=${CLAUDE_MODEL:}
