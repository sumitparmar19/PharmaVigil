# PharmaVigil on one machine: Oracle, Kafka (KRaft), ActiveMQ Artemis, the five Java services and the UI.
# Prerequisites: `cd services && mvn -B package -DskipTests` (builds the jars), `scripts/fetch-e2b-xsd.sh .e2b-xsd`
# (official E2B(R3) schemas; without them nothing can be submitted), and a .env file with the secrets listed in
# .env.example. Then: `docker compose up -d --build` and open http://localhost:8080.
# Demo data: synthetic patients and demo logins (pharmacist / reviewer / admin, password PV_DEMO_PASSWORD).
# The model bundle mounted by default is the tiny synthetic test fixture: its suggestions are labelled
# "fixture:" and mean nothing; point MODEL_BUNDLE_DIR at a trained bundle to use real models.
# Observability (docs/OBSERVABILITY.md): `PV_TRACING=true docker compose --profile observability up -d` adds
# Prometheus (:9090), Grafana (:3000, dashboards preloaded) and Jaeger (:16686) and turns tracing on.

x-java: &java
  restart: unless-stopped
  depends_on:
    oracle: { condition: service_healthy }
    kafka: { condition: service_healthy }
  environment: &java-env
    ORACLE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
    ORACLE_PASSWORD: ${PV_DB_PASSWORD:?set PV_DB_PASSWORD in .env}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # OpenTelemetry Java agent (traces only; metrics go through /actuator/prometheus)
    OTEL_JAVAAGENT_ENABLED: ${PV_TRACING:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_METRICS_EXPORTER: none
    OTEL_LOGS_EXPORTER: none

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      PV_DB_PASSWORD: ${PV_DB_PASSWORD:?set PV_DB_PASSWORD in .env}
    volumes:
      - ./ops/helm/oracle-free/files/oracle-init.sh:/container-entrypoint-initdb.d/01-schemas.sh:ro
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  artemis:
    image: apache/activemq-artemis:2.44.0-alpine
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:?set ARTEMIS_USER in .env}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:?set ARTEMIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 61616"]
      interval: 10s
      timeout: 5s
      retries: 20

  pharmacy-service:
    <<: *java
    build: { context: services, dockerfile: Dockerfile, args: { SERVICE: pharmacy-service } }
    environment:
      <<: *java-env
      ORACLE_USER: pv_pharmacy
      OTEL_SERVICE_NAME: pharmacy-service
      SPRING_PROFILES_ACTIVE: demo
      PV_DEMO_PASSWORD: ${PV_DEMO_PASSWORD:?set PV_DEMO_PASSWORD in .env}
      INTAKE_GATEWAY_URL: http://intake-gateway:8082
      SIGNAL_SERVICE_URL: http://signal-service:8084

  intake-gateway:
    <<: *java
    build: { context: services, dockerfile: Dockerfile, args: { SERVICE: intake-gateway } }
    environment:
      <<: *java-env
      ORACLE_USER: pv_intake
      OTEL_SERVICE_NAME: intake-gateway
      SOAP_PARTNER_USER: ${SOAP_PARTNER_USER:-}
      SOAP_PARTNER_PASSWORD: ${SOAP_PARTNER_PASSWORD:-}
      PV_E2B_XSD_DIR: /xsd
    volumes:
      - ${E2B_XSD_DIR:-./.e2b-xsd}:/xsd:ro
    ports:
      - "8082:8082"   # SOAP partner intake (WS-Security) and REST intake

  case-service:
    <<: *java
    build: { context: services, dockerfile: Dockerfile, args: { SERVICE: case-service } }
    environment:
      <<: *java-env
      ORACLE_USER: pv_case
      OTEL_SERVICE_NAME: case-service
      PV_MODEL_DIR: /models
      PV_E2B_XSD_DIR: /xsd
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
    volumes:
      - ${MODEL_BUNDLE_DIR:-./services/case-service/src/test/resources/model-bundle}:/models:ro
      - ${E2B_XSD_DIR:-./.e2b-xsd}:/xsd:ro

  signal-service:
    <<: *java
    build: { context: services, dockerfile: Dockerfile, args: { SERVICE: signal-service } }
    environment:
      <<: *java-env
      ORACLE_USER: pv_signal
      OTEL_SERVICE_NAME: signal-service
      PV_SIGNALS_DIR: ${SIGNALS_DIR:+/signals}
    volumes:
      - ${SIGNALS_DIR:-./ops/compose/no-signals}:/signals:ro

  submission-gateway:
    <<: *java
    build: { context: services, dockerfile: Dockerfile, args: { SERVICE: submission-gateway } }
    depends_on:
      oracle: { condition: service_healthy }
      kafka: { condition: service_healthy }
      artemis: { condition: service_healthy }
    environment:
      <<: *java-env
      ORACLE_USER: pv_submission
      OTEL_SERVICE_NAME: submission-gateway
      ARTEMIS_BROKER_URL: tcp://artemis:61616
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      PV_E2B_XSD_DIR: /xsd
    volumes:
      - ${E2B_XSD_DIR:-./.e2b-xsd}:/xsd:ro

  frontend:
    build: { context: frontend }
    restart: unless-stopped
    depends_on: [pharmacy-service, case-service, signal-service, submission-gateway, intake-gateway]
    ports:
      - "8080:8080"

  # --- Observability (profile "observability")
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/grafana/alerts:/etc/prometheus/rules:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [observability]
    depends_on: [prometheus]
    environment:
      # Read-only local demo: dashboards and alert rules come from files, so nobody needs to sign in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"   # UI; services send OTLP to jaeger:4318 inside the network

volumes:
  oracle-data:
