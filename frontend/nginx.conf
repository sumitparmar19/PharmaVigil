# nginx for the PharmaVigil UI: static files, single-page-app fallback, and /api routing to the services
# (container names from docker-compose.yml / Kubernetes service names). Security headers on every response.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/cases/       { proxy_pass http://case-service:8083; }
    location /api/signals/     { proxy_pass http://signal-service:8084; }
    location /api/submissions/ { proxy_pass http://submission-gateway:8085; }
    location /api/intake/      { proxy_pass http://intake-gateway:8082; }
    location /api/             { proxy_pass http://pharmacy-service:8081; }

    location / {
        try_files $uri /index.html;
    }
}
