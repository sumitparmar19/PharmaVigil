# PharmaVigil models: signal baselines, the SafetyFormer Transformer, the MedDRA coder,
# seriousness triage, duplicate detection and ONNX export with parity tests.
[project]
name = "pharmavigil-ml"
version = "0.1.0"
description = "Signal detection (baselines + SafetyFormer), MedDRA coder, triage and ONNX export"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pharmavigil_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
