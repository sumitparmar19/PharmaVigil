# PharmaVigil CI: runs on every push and pull request. Java (Maven verify with Testcontainers),
# Python data/ml tests and lint, frontend typecheck/lint/tests/build, and a gitleaks secret scan
# over the full git history (BUILD_INSTRUCTIONS §8).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (Maven verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Fetch the ICH E2B(R3) schema set (best effort; the e2b-schema job is the gate)
        run: scripts/fetch-e2b-xsd.sh "$RUNNER_TEMP/e2b-xsd" || echo "::warning::E2B(R3) schemas not fetched"
      - name: Build and test (Oracle Database Free via Testcontainers)
        working-directory: services
        env:
          PV_E2B_XSD_DIR: ${{ runner.temp }}/e2b-xsd
        run: mvn -B -ntp verify
      - name: Test summary per class
        if: always()
        run: grep -h "Tests run" services/*/target/surefire-reports/*.txt || true
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: services/**/target/site/jacoco/
          if-no-files-found: ignore

  java-sqlserver:
    name: Java on SQL Server (portability profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Repository and integration tests on SQL Server 2022
        working-directory: services
        run: mvn -B -ntp -Pmssql verify

  e2b-schema:
    # The official E2B(R3) schemas are not committed (docs/E2B_R3.md). GitHub's runners can reach the copy EMA
    # publishes, so this job fetches the set and runs the export-validation tests against it.
    name: E2B(R3) export against the official schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Fetch the ICH E2B(R3) schema set
        run: scripts/fetch-e2b-xsd.sh "$RUNNER_TEMP/e2b-xsd"
      - name: Validate exported ICSR files
        working-directory: services
        env:
          PV_E2B_XSD_DIR: ${{ runner.temp }}/e2b-xsd
        run: mvn -B -ntp -pl common test -Dtest='E2b*Test' -Dsurefire.failIfNoSpecifiedTests=false

  python:
    name: Python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: data
            extras: dev,spark
          - package: ml
            extras: dev,train
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6  # PySpark needs a JVM
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v7
      - name: Install
        working-directory: ${{ matrix.package }}
        run: |
          uv venv
          if [ "${{ matrix.package }}" = "ml" ]; then
            # CPU-only PyTorch keeps the CI install small; the code picks CUDA only when present.
            uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          uv pip install -e '.[${{ matrix.extras }}]'
      - name: Lint
        working-directory: ${{ matrix.package }}
        run: .venv/bin/ruff check .
      - name: Test
        working-directory: ${{ matrix.package }}
        run: .venv/bin/pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --redact --verbose --exit-code 1

  stack:
    name: Full stack (docker compose + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the service jars
        working-directory: services
        run: mvn -B -ntp -DskipTests package
      - name: Fetch the ICH E2B(R3) schema set (best effort)
        run: scripts/fetch-e2b-xsd.sh .e2b-xsd || echo "::warning::E2B(R3) schemas not fetched"
      - name: Throwaway secrets for this run only (random, masked, never stored)
        run: |
          for name in ORACLE_PASSWORD PV_DB_PASSWORD JWT_SECRET PV_DEMO_PASSWORD ARTEMIS_PASSWORD; do
            value="Pv$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> .env
          done
          echo "ARTEMIS_USER=pvbroker" >> .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Wait for the five services
        run: |
          timeout 300 bash -c 'until [ "$(docker compose logs 2>&1 | grep -cE "Started [A-Za-z]+Application")" -ge 5 ]; do
            if docker compose logs 2>&1 | grep -q "APPLICATION FAILED"; then exit 1; fi; sleep 3; done'
      - name: Install the Playwright browser
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser smoke test
        working-directory: frontend
        run: |
          export PV_DEMO_PASSWORD="$(grep '^PV_DEMO_PASSWORD=' ../.env | cut -d= -f2-)"
          npm run e2e
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  terraform:
    name: Azure Terraform (fmt, validate, test, Checkov)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure
    env:
      TF_VERSION: 1.16.5
      CHECKOV_VERSION: 3.3.26
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Terraform (checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS"
          grep linux_amd64 "terraform_${TF_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "terraform_${TF_VERSION}_linux_amd64.zip" -d tfbin && echo "$PWD/tfbin" >> "$GITHUB_PATH"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: terraform test (mocked provider, no Azure account)
        run: terraform test
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Checkov
        run: |
          pip install --quiet "checkov==${CHECKOV_VERSION}"
          checkov -d . --framework terraform --skip-download --compact
