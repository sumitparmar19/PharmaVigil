# PharmaVigil CI: runs on every push and pull request. Java (Maven verify with Testcontainers),
# Python data/ml tests and lint, frontend typecheck/lint/tests/build, and a gitleaks secret scan
# over the full git history (BUILD_INSTRUCTIONS §8).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (Maven verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (Oracle Database Free via Testcontainers)
        working-directory: services
        run: mvn -B -ntp verify
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: services/**/target/site/jacoco/
          if-no-files-found: ignore

  java-sqlserver:
    name: Java on SQL Server (portability profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Repository and integration tests on SQL Server 2022
        working-directory: services
        run: mvn -B -ntp -Pmssql verify

  e2b-schema-discovery:
    # Temporary (M7): the build container cannot reach the E2B(R3) schema hosts. This job checks whether
    # GitHub's runners can (EMA serves the files at the schemaLocation used in ICSR files; ICH hosts the zip).
    name: E2B(R3) schema link discovery
    runs-on: ubuntu-latest
    steps:
      - name: Probe EMA and ICH
        run: |
          for u in \
            "https://eudravigilance.ema.europa.eu/XSD/multicacheschemas/MCCI_IN200100UV01.xsd" \
            "http://eudravigilance.ema.europa.eu/XSD/multicacheschemas/MCCI_IN200100UV01.xsd" \
            "https://www.ich.org/page/e2br3-individual-case-safety-report-icsr-specification-and-related-files" \
            "https://database.ich.org/sites/default/files/ICH_ICSR_Schema_Files.zip"; do
            curl -sSL -o probe.out -w "%{http_code} %{size_download} bytes %{content_type} <- $u\n" "$u" || echo "failed <- $u"
            head -c 300 probe.out | tr -d '\000' | head -5 || true
            echo
          done
          curl -sSL "https://eudravigilance.ema.europa.eu/XSD/multicacheschemas/MCCI_IN200100UV01.xsd" \
            | grep -oE '(include|import)[^>]*schemaLocation="[^"]+"' | head -20 || true

  python:
    name: Python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: data
            extras: dev,spark
          - package: ml
            extras: dev,train
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6  # PySpark needs a JVM
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v7
      - name: Install
        working-directory: ${{ matrix.package }}
        run: |
          uv venv
          if [ "${{ matrix.package }}" = "ml" ]; then
            # CPU-only PyTorch keeps the CI install small; the code picks CUDA only when present.
            uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          uv pip install -e '.[${{ matrix.extras }}]'
      - name: Lint
        working-directory: ${{ matrix.package }}
        run: .venv/bin/ruff check .
      - name: Test
        working-directory: ${{ matrix.package }}
        run: .venv/bin/pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --redact --verbose --exit-code 1
