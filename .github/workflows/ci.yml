# PharmaVigil CI: runs on every push and pull request. Java (Maven verify with Testcontainers),
# Python data/ml tests and lint, frontend typecheck/lint/tests/build, and a gitleaks secret scan
# over the full git history (BUILD_INSTRUCTIONS §8).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (Maven verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: services
        run: mvn -B -ntp verify
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: services/**/target/site/jacoco/
          if-no-files-found: ignore

  python:
    name: Python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: data
            extras: dev,spark
          - package: ml
            extras: dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6  # PySpark needs a JVM
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v7
      - name: Install
        working-directory: ${{ matrix.package }}
        run: |
          uv venv
          uv pip install -e '.[${{ matrix.extras }}]'
      - name: Lint
        working-directory: ${{ matrix.package }}
        run: .venv/bin/ruff check .
      - name: Test
        working-directory: ${{ matrix.package }}
        run: .venv/bin/pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --redact --verbose --exit-code 1
