# Daily proof that the public live demo works (docs/DEMO_HOSTING.md): Playwright against the URL in the repository
# variable DEMO_URL signs in with the demo account shown on the landing page, runs a 10-report replay of real FAERS
# reports, waits for one case to reach the regulator's ACK, opens its E2B(R3) XML and checks the Signals and
# Evidence pages. The README shows this workflow's badge. It never runs in normal CI and is skipped until DEMO_URL is set.
name: Live smoke test

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live demo end to end
    if: vars.DEMO_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run against the live demo
        working-directory: frontend
        env:
          PV_LIVE_URL: ${{ vars.DEMO_URL }}
        run: npm run e2e:live
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-smoke-report
          path: frontend/playwright-live-report/
          if-no-files-found: ignore
