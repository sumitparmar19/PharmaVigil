# Kafka for PharmaVigil on Kubernetes, run by the Strimzi operator (0.51.0; ADR-010): one KRaft node acting as
# controller and broker, ephemeral storage, plain listener inside the cluster. Strimzi 0.51 supports Kafka up
# to 4.2.0, so the cluster runs 4.2.0 (docker compose uses the Apache image 4.3.2). Bootstrap address for the
# services: pv-kafka-kafka-bootstrap:9092.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: pv-kafka
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: ephemeral
  resources:
    requests: {cpu: 200m, memory: 768Mi}
    limits: {memory: 1Gi}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: pv-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      num.partitions: 3
  entityOperator:
    topicOperator: {}
