# Pipeline topics and their dead-letter twins (common/events/Topics), managed by Strimzi's topic operator:
# 3 partitions each (events of one case share a key, so they stay in order), one replica on the demo cluster.
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: report-received
  labels:
    strimzi.io/cluster: pv-kafka
spec:
  topicName: report.received
  partitions: 3
  replicas: 1
---
apiVersion: kafka.strimzi.io/v1beta2
