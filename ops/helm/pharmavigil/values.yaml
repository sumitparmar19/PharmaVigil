# Umbrella values. Secrets are never here: create the Secret named in global.secretName first (docs/KUBERNETES.md
# lists its keys). Images default to pharmavigil/<service>:<global.imageTag>.
global:
  secretName: pharmavigil-secrets
  imageTag: "0.1.0"
  imagePullPolicy: IfNotPresent
  # Init container that holds each service until its database and brokers accept connections.
  waitImage: busybox:1.37.0

# Demo infrastructure; switch off to point the services at managed databases and brokers.
oracle-free:
  enabled: true
artemis:
  enabled: true
