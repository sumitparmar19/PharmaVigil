{{/* Demo ActiveMQ Artemis: Deployment + Service "artemis" (core protocol on 61616). */}}
{{- $secret := .Values.global.secretName | default "pharmavigil-secrets" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artemis
  labels: {app.kubernetes.io/name: artemis, app.kubernetes.io/part-of: pharmavigil}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: artemis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: artemis, app.kubernetes.io/part-of: pharmavigil}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: artemis
          image: {{ .Values.image }}
          ports: [{name: core, containerPort: 61616}]
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: ARTEMIS_USER
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: ARTEMIS_USER}}
            - name: ARTEMIS_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: ARTEMIS_PASSWORD}}
          readinessProbe:
            tcpSocket: {port: core}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: artemis
spec:
  selector: {app.kubernetes.io/name: artemis}
  ports: [{name: core, port: 61616, targetPort: core}]
