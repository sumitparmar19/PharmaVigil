# nginx for the public live demo (docker-compose.demo.yml mounts this over the image's default config). Same routing
# as frontend/nginx.conf, plus abuse limits: requests per client IP (the real IP from Caddy's X-Forwarded-For),
# small request bodies, and no public route to uploads, SOAP, admin or reload endpoints. The replay itself runs
# inside intake-gateway, so blocking public uploads does not block the demo.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=runs:10m rate=4r/m;
limit_req_status 429;

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 16k;

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Not public on the demo: E2B uploads, pharmacy report intake (pharmacy-service calls intake directly),
    # signal reload, actuator and SOAP.
    location = /api/intake/e2b       { return 403; }
    location = /api/intake/reports   { return 403; }
    location = /api/signals/reload   { return 403; }
    location /actuator/              { return 404; }
    location /ws/                    { return 404; }

    location = /api/auth/login       { limit_req zone=login burst=5 nodelay; proxy_pass http://pharmacy-service:8081; }
    location = /api/intake/demo/runs { limit_req zone=runs burst=2 nodelay; proxy_pass http://intake-gateway:8082; }
    location = /api/status           { limit_req zone=api burst=10 nodelay; proxy_pass http://case-service:8083; }
    location /api/cases/             { limit_req zone=api burst=40 nodelay; proxy_pass http://case-service:8083; }
    location /api/signals/           { limit_req zone=api burst=40 nodelay; proxy_pass http://signal-service:8084; }
    location /api/submissions/       { limit_req zone=api burst=20 nodelay; proxy_pass http://submission-gateway:8085; }
    location /api/intake/            { limit_req zone=api burst=40 nodelay; proxy_pass http://intake-gateway:8082; }
    location /api/                   { limit_req zone=api burst=40 nodelay; proxy_pass http://pharmacy-service:8081; }

    location / {
        try_files $uri /index.html;
    }
}
